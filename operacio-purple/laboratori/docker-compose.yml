# ============================================================================
#  PURPLE LAB — Laboratori de Purple Team per a ASIX (RA4 · Digitalització + IA)
# ----------------------------------------------------------------------------
#  Aixeca tot el laboratori amb:   docker compose up -d --build
#  Atura'l i esborra-ho tot amb:   docker compose down -v
#
#  Xarxa aïllada del lab: 172.30.0.0/24  (NO és la teva xarxa de casa)
#    - attacker    172.30.0.10   La teva màquina d'atac (red team)
#    - web-proxy   172.30.0.15   Nginx davant del web (genera logs nets)
#    - dvwa        172.30.0.20   Aplicació web vulnerable (víctima)
#    - ssh-target  172.30.0.30   Servei SSH amb credencials febles (víctima)
#    - soc         172.30.0.40   Blue team: detecció + IA + panell web
#
#  Ports publicats al teu ordinador (host):
#    - http://localhost:8080   -> web vulnerable (DVWA) a través del proxy
#    - http://localhost:8000   -> panell del SOC (blue team)
#    - ssh -p 2222 lab@localhost  (si vols entrar a la víctima SSH)
# ============================================================================

services:

  # -------------------------------------------------------------------------
  # RED TEAM — caixa d'eines de l'atacant (nmap, hydra, sqlmap, curl, python)
  # -------------------------------------------------------------------------
  attacker:
    build: ./attacker
    container_name: lab-attacker
    hostname: attacker
    networks:
      lab-net:
        ipv4_address: 172.30.0.10
    volumes:
      - ./ai:/opt/ai:ro          # prompts i copilot d'IA ofensiva
      - ./loot:/loot             # on desaràs resultats (scans, hashos...)
    stdin_open: true             # permet "docker compose exec attacker bash"
    tty: true
    command: sleep infinity      # es manté viu esperant que hi entris

  # -------------------------------------------------------------------------
  # Proxy Nginx: tot el trànsit web passa per aquí i es registra a /logs/web
  # -------------------------------------------------------------------------
  web-proxy:
    image: nginx:1.27-alpine
    container_name: lab-web-proxy
    hostname: web-proxy
    depends_on:
      - dvwa
    networks:
      lab-net:
        ipv4_address: 172.30.0.15
    ports:
      - "8080:80"                # http://localhost:8080
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/logs             # escriu access.log a /logs/web/

  # -------------------------------------------------------------------------
  # VÍCTIMA WEB — DVWA (Damn Vulnerable Web Application)
  #   Nivell de seguretat ajustable (Low/Medium/High) = ideal per purple team
  # -------------------------------------------------------------------------
  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: lab-dvwa
    hostname: dvwa
    networks:
      lab-net:
        ipv4_address: 172.30.0.20
    # No publiquem ports: només s'hi arriba per dins del lab (via proxy).

  # -------------------------------------------------------------------------
  # VÍCTIMA SSH — usuari amb contrasenya feble, per practicar força bruta.
  #   sshd escriu els intents a /logs/ssh/sshd.log perquè el SOC els llegeixi.
  # -------------------------------------------------------------------------
  ssh-target:
    build: ./targets/ssh-target
    container_name: lab-ssh-target
    hostname: ssh-target
    networks:
      lab-net:
        ipv4_address: 172.30.0.30
    ports:
      - "2222:22"                # ssh -p 2222 lab@localhost
    volumes:
      - ./logs:/logs

  # -------------------------------------------------------------------------
  # BLUE TEAM — SOC: motor de detecció (regles) + triatge amb IA + panell web
  # -------------------------------------------------------------------------
  soc:
    build: ./soc
    container_name: lab-soc
    hostname: soc
    networks:
      lab-net:
        ipv4_address: 172.30.0.40
    ports:
      - "8000:8000"              # http://localhost:8000
    env_file:
      - .env                     # configuració de l'IA (copia .env.example -> .env)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # a Linux, perquè el SOC arribi a Ollama del host
    volumes:
      - ./logs:/logs             # llegeix logs de les víctimes i escriu alertes
      - ./soc:/app               # el codi del SOC (editable sense reconstruir)

networks:
  lab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
