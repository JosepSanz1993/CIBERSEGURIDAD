# ============================================================================
#  REGLES DE DETECCIÓ del blue team.
#  Són TRANSPARENTS a propòsit: obre-les, llegeix-les i modifica-les.
#  Aprendre a escriure una regla de detecció és mig blue team.
#
#  Camps de cada regla:
#    source    : fitxer de log que vigila
#    pattern   : expressió regular que busca (Python re, case-insensitive amb (?i))
#    type      : "match"      -> alerta a cada línia que coincideix
#                "threshold"  -> alerta quan es repeteix N cops (per IP) en X segons
#    threshold / window_seconds : només per type=threshold
#    mitre     : tècnica MITRE ATT&CK associada
#    severity  : baixa | mitjana | alta | critica
# ============================================================================

ssh_bruteforce:
  description: "Força bruta SSH: molts intents de contrasenya fallits"
  source: /logs/ssh/sshd.log
  pattern: 'Failed password for (?:invalid user )?(?P<user>\S+) from (?P<ip>\d+\.\d+\.\d+\.\d+)'
  type: threshold
  threshold: 5
  window_seconds: 60
  mitre: "T1110 — Brute Force"
  severity: alta

ssh_login_success:
  description: "Autenticació SSH correcta (possible compromís si ve després d'una força bruta)"
  source: /logs/ssh/sshd.log
  pattern: 'Accepted password for (?P<user>\S+) from (?P<ip>\d+\.\d+\.\d+\.\d+)'
  type: match
  mitre: "T1078 — Valid Accounts"
  severity: alta

web_sqli:
  description: "Possible injecció SQL a una petició web"
  source: /logs/web/access.log
  pattern: "(?i)(union\\s+select|'\\s*or\\s*'|\\bor\\s+\\d+\\s*=\\s*\\d+|%27|information_schema|sleep\\(|benchmark\\(|xp_cmdshell)"
  type: match
  mitre: "T1190 — Exploit Public-Facing Application"
  severity: alta

web_xss:
  description: "Possible Cross-Site Scripting (XSS) a una petició web"
  source: /logs/web/access.log
  pattern: "(?i)(<script|%3cscript|onerror=|onmouseover=|javascript:|alert\\()"
  type: match
  mitre: "T1059 — Command and Scripting Interpreter"
  severity: mitjana

web_path_traversal:
  description: "Possible path traversal / lectura de fitxers del sistema"
  source: /logs/web/access.log
  pattern: "(\\.\\./|\\.\\.%2f|%2e%2e|/etc/passwd|boot\\.ini)"
  type: match
  mitre: "T1083 — File and Directory Discovery"
  severity: mitjana

web_scanner_tool:
  description: "Eina d'escaneig automàtic detectada pel User-Agent"
  source: /logs/web/access.log
  pattern: "(?i)(nikto|sqlmap|nmap|masscan|dirb|gobuster|wpscan|hydra)"
  type: match
  mitre: "T1595 — Active Scanning"
  severity: baixa
