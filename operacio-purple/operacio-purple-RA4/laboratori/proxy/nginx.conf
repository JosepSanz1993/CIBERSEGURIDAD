# Nginx fa de porta d'entrada al web vulnerable i registra CADA petició.
# Aquest access.log és la principal font de dades del blue team per als atacs web.
events {}

http {
    # Format de log pensat perquè el SOC el pugui analitzar fàcilment.
    # Inclou la línia completa de petició ($request) amb mètode + URI + query string,
    # on apareixen els intents de SQLi, XSS, path traversal, etc.
    log_format lab '$time_iso8601 $remote_addr "$request" '
                   '$status $body_bytes_sent "$http_user_agent"';

    access_log /logs/web/access.log lab;
    error_log  /logs/web/error.log warn;

    server {
        listen 80;

        location / {
            proxy_pass http://dvwa:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
