<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" font-family="Arial, Helvetica, sans-serif">
  <title>Zonas de red y política del cortafuegos — Nexora Solutions</title>

  <!-- Leyenda -->
  <rect x="515" y="36" width="195" height="80" rx="6" fill="#FFFFFF" stroke="#E4E3DD" stroke-width="1"/>
  <text x="525" y="52" font-size="11" font-weight="bold" fill="#444441">Política de flujos</text>
  <line x1="525" y1="66" x2="548" y2="66" stroke="#1E874B" stroke-width="3"/>
  <text x="553" y="70" font-size="11" fill="#444441">permitido</text>
  <line x1="525" y1="86" x2="548" y2="86" stroke="#C0392B" stroke-width="3"/>
  <text x="553" y="90" font-size="11" fill="#444441">denegado</text>
  <line x1="525" y1="106" x2="548" y2="106" stroke="#D98A1E" stroke-width="3" stroke-dasharray="4 3"/>
  <text x="553" y="110" font-size="11" fill="#444441">debilidad introducida</text>

  <!-- Zona atacante -->
  <rect x="210" y="40" width="300" height="84" rx="12" fill="#FBEEE9" stroke="#D85A30" stroke-width="1.5"/>
  <text x="360" y="66" font-size="14" font-weight="bold" fill="#712B13" text-anchor="middle">Zona atacante (no confiable)</text>
  <text x="360" y="86" font-size="12" fill="#993C1D" text-anchor="middle">seg-atacante · 10.10.99.0/24</text>
  <text x="360" y="105" font-size="11" fill="#993C1D" text-anchor="middle">Kali auditora · gateway 10.10.99.1</text>

  <!-- Flujo permitido: atacante -> DMZ -->
  <polyline points="300,124 180,250 180,346 205,452" fill="none" stroke="#1E874B" stroke-width="2.5"/>
  <polygon points="199,444 211,444 205,453" fill="#1E874B"/>
  <text x="78" y="404" font-size="12" font-weight="bold" fill="#1E874B">PERMITIDO</text>
  <text x="78" y="420" font-size="11" fill="#1E874B">servicios publicados</text>
  <text x="78" y="434" font-size="11" fill="#1E874B">80·443·21·25·389·161</text>

  <!-- Flujo denegado: atacante -> interna -->
  <line x1="430" y1="124" x2="558" y2="240" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="560" y="206" font-size="11" fill="#C0392B" text-anchor="middle">atacante → interna</text>
  <text x="560" y="222" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle">DENEGADO</text>
  <circle cx="560" cy="250" r="13" fill="#FFFFFF" stroke="#C0392B" stroke-width="3"/>
  <line x1="551" y1="241" x2="569" y2="259" stroke="#C0392B" stroke-width="3"/>

  <!-- Enlace estructural firewall -> interna -->
  <line x1="515" y1="346" x2="515" y2="452" stroke="#B0AFA8" stroke-width="1.2"/>

  <!-- Cortafuegos -->
  <rect x="70" y="250" width="580" height="96" rx="12" fill="#EDECFC" stroke="#534AB7" stroke-width="2"/>
  <text x="360" y="284" font-size="16" font-weight="bold" fill="#3C3489" text-anchor="middle">CORTAFUEGOS — Ubuntu Server (nftables)</text>
  <text x="360" y="306" font-size="12" fill="#534AB7" text-anchor="middle">Política por defecto: DENEGAR · enruta y filtra entre zonas</text>
  <text x="360" y="326" font-size="11" fill="#6A62C9" text-anchor="middle">Servicios base para todas las zonas: DNS (53) · DHCP (67/68)</text>

  <!-- Zona DMZ -->
  <rect x="70" y="452" width="270" height="96" rx="12" fill="#FBF3E2" stroke="#C98A1E" stroke-width="1.5"/>
  <text x="205" y="478" font-size="14" font-weight="bold" fill="#7A5310" text-anchor="middle">Zona DMZ (servicios publicados)</text>
  <text x="205" y="498" font-size="12" fill="#9A6A16" text-anchor="middle">seg-dmz · 10.10.30.0/24</text>
  <text x="205" y="516" font-size="11" fill="#9A6A16" text-anchor="middle">gateway 10.10.30.1 · contenedores</text>

  <!-- Zona interna -->
  <rect x="380" y="452" width="270" height="96" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="515" y="478" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle">Zona interna (confiable)</text>
  <text x="515" y="498" font-size="12" fill="#0F6E56" text-anchor="middle">seg-interna · 10.10.20.0/24</text>
  <text x="515" y="516" font-size="11" fill="#0F6E56" text-anchor="middle">gateway 10.10.20.1 · Rocky + SIEM</text>

  <!-- Callout DMZ -> interna -->
  <rect x="70" y="562" width="580" height="30" rx="6" fill="#F7F6F1" stroke="#C9C8C1" stroke-width="1"/>
  <text x="84" y="581" font-size="11" fill="#444441">DMZ → interna:
    <tspan fill="#1E874B" font-weight="bold">  1514-1515 telemetría Wazuh = permitido</tspan>
    <tspan fill="#555">   ·   </tspan>
    <tspan fill="#D98A1E" font-weight="bold">445 SMB = debilidad de segmentación introducida</tspan>
  </text>
</svg>
