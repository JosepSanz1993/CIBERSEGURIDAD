  <text x="140" y="435" font-size="11" fill="#0F6E56">restringido a grupo @direccion · solo lectura</text>
  <text x="606" y="414" font-size="11" fill="#6A6A64" text-anchor="end">Alta</text>
  <text x="606" y="435" font-size="12" font-weight="bold" fill="#0F6E56" text-anchor="end">Correcto (referencia)</text>

  <!-- intercambio -->
  <rect x="100" y="464" width="520" height="58" rx="8" fill="#FBF3E2" stroke="#C98A1E" stroke-width="1.2"/>
  <path d="M0,2 h6 l2,2.5 h9 v9 h-17 z" transform="translate(116,484)" fill="#C98A1E"/>
  <text x="140" y="488" font-size="14" font-weight="bold" fill="#7A5310">intercambio/</text>
  <text x="140" y="507" font-size="11" fill="#9A6A16">escritura anónima · buzón abierto</text>
  <text x="606" y="486" font-size="11" fill="#6A6A64" text-anchor="end">Baja</text>
  <text x="606" y="507" font-size="12" font-weight="bold" fill="#B4791A" text-anchor="end">Hallazgo</text>

  <!-- Leyenda -->
  <rect x="40" y="560" width="14" height="14" rx="3" fill="#EAF2EC" stroke="#5E8A72"/>
  <text x="60" y="571" font-size="11" fill="#4A4A46">Aceptable</text>
  <rect x="160" y="560" width="14" height="14" rx="3" fill="#FBF3E2" stroke="#C98A1E"/>
  <text x="180" y="571" font-size="11" fill="#4A4A46">Hallazgo</text>
  <rect x="270" y="560" width="14" height="14" rx="3" fill="#FBEAE7" stroke="#C0392B"/>
  <text x="290" y="571" font-size="11" fill="#4A4A46">Hallazgo crítico</text>
  <rect x="420" y="560" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="440" y="571" font-size="11" fill="#4A4A46">Correcto (referencia)</text>
