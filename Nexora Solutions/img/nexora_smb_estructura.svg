  <text x="140" y="363" font-size="11" fill="#A5372A">invitado LEE + ESCRIBE · credenciales y clave privada</text>
  <text x="606" y="342" font-size="11" fill="#6A6A64" text-anchor="end">Crítica (IT)</text>
  <text x="606" y="363" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="end">Hallazgo crítico</text>

  <!-- direccion -->
